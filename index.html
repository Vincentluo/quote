<style>
*{box-sizing:border-box;margin:0;padding:0}

h1{font-size:17px;margin-bottom:4px}
.sub{font-size:11px;color:#7a8ea0;margin-bottom:12px}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
label{display:block;font-size:12px;color:#5a6b7c;margin:8px 0 3px}

.row{display:flex;gap:8px}
.row>*{flex:1}
.btn{display:block;width:100%;padding:12px;border:0;border-radius:10px;background:#1677ff;color:#fff;font-size:16px;font-weight:600;margin-top:12px}
.btn:active{opacity:.8}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
th,td{padding:7px 6px;text-align:left;border-bottom:1px solid #eef2f6}

td.win{color:#e8590c;font-weight:700}
.note{font-size:11px;color:#7a8ea0;margin-top:6px}
.out-title{font-size:14px;font-weight:700;margin:14px 0 2px}
.copybox{width:100%;min-height:86px;font-size:12px;font-family:Menlo,Consolas,monospace;background:#f6f9fc;border:1px dashed #b9c9d8;border-radius:8px;padding:8px;color:#1a2b3c}
.btn-sm{display:inline-block;padding:6px 14px;background:#eef4fb;color:#1677ff;border:1px solid #c6dcf5;border-radius:8px;font-size:12px;margin-top:6px}

.item{border:1px solid #e9eff5;border-radius:10px;padding:0 8px 8px;margin-top:8px;background:#fbfdff}
.item.err{border-color:#ffb37a;background:#fff9f2}
.item-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#5a6b7c;margin-top:6px}
.del{background:none;border:0;color:#e8590c;font-size:12px;padding:2px 4px}
.add{display:inline-block;padding:6px 14px;background:#eef4fb;color:#1677ff;border:1px solid #c6dcf5;border-radius:8px;font-size:12px;margin-top:8px}
.tag{display:inline-block;padding:1px 6px;border-radius:6px;font-size:11px}

</head>
<body>
<h1>欧洲超大件报价查询器</h1>
<div class="sub">锦联 / 欧氪 · DDP 到门 · 含利润 · <span id="ver"></span></div>

<div class="card">
<label>目的国</label>
<select id="country"></select>
<label>邮编</label>
<input id="zip" inputmode="numeric" placeholder="如 41352 / 17411">
<label>抛比系数（体积重 = 长×宽×高÷系数）</label>
<select id="coef">
  <option value="6000" selected>1:6000 · 空运/海派（1CBM≈167kg）· 锦联欧氪海运卡派默认</option>
  <option value="5000">1:5000 · 国际快递（1CBM≈200kg）</option>
  <option value="1000">1:1000 · 海运拼柜（1CBM=1RT）</option>
  <option value="custom">自定义系数…</option>
</select>
<input id="coefCustom" type="number" inputmode="decimal" placeholder="填写系数，如 8000" style="display:none;margin-top:6px">
<label>货量明细（不同尺寸点「加一行」；也可粘贴客户询价后点「识别填入」）</label>
<textarea id="paste" class="copybox" style="min-height:52px" placeholder="如：211*32*115cm 1件 114kg（可多行）"></textarea>
<button class="add" type="button" onclick="parsePaste()">识别填入</button>
<div id="items"></div>
<button class="add" type="button" onclick="addItem()">+ 加一行货物</button>
<label>货值 CNY（可选，用于算保费）</label>
<input id="val" type="number" inputmode="decimal" placeholder="不填则提示确认货值">
<button class="btn" onclick="calc()">查 报 价</button>
</div>

<div id="out"></div>

var DLV = DATA.delivery;
var DEF_COEF = 6000;          // 渠道默认抛比系数（锦联/欧氪海运卡派按 1:6000 计费）
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}

function fmt(n){return Math.round(n).toLocaleString('zh-CN');}
function inRange(zip2, r){for(var i=0;i<r.num.length;i++){if(zip2>=r.num[i][0]&&zip2<=r.num[i][1])return true;}return false;}
function alphaMatch(alpha, segs){for(var i=0;i<segs.length;i++){if(alpha.indexOf(segs[i])===0)return true;}return false;}
function matchZone(zones, zip){
  var digits=(zip||'').replace(/\D/g,'');
  var alpha=(zip||'').replace(/[^A-Za-z]/g,'').toUpperCase();
  if(digits){
    var z2=parseInt(digits.slice(0,2),10);
    for(var z in zones){if(inRange(z2,zones[z].ranges))return z;}
    if(alpha){for(var z2k in zones){if(alphaMatch(alpha,zones[z2k].ranges.alpha))return z2k;}}
  } else {
    for(var z3 in zones){if(alphaMatch(alpha,zones[z3].ranges.alpha))return z3;}
  }
  return null;
}
function band(prices,w){var lo=[0,31,51,76,101,151,201,251,301,451,601,801,1001,1501];
  var idx=0;for(var i=0;i<lo.length;i++){if(w>=lo[i])idx=i;}return prices[idx];}
function okBand(ps,w){var lo=[100,300,500,1000,2000];var idx=0;
  for(var i=0;i<lo.length;i++){if(w>=lo[i])idx=i;}
  var p=ps[idx];if(p==null){for(var j=ps.length-1;j>=0;j--){if(ps[j]!=null)return ps[j];}}
  return p;}

/* ==========================================================================
   核心计算（纯函数，不读写 DOM，便于自动化验证）
   opt = {country, zip, value, coef, items:[{L,W,H,qty,gw}]}
   规则与原版完全一致：计费重 = 向下取整(max(总实重, 总材积重))
   ========================================================================== */
function computeQuote(data, dlv, opt){
  var items = opt.items || [];
  var coef = opt.coef > 0 ? opt.coef : DEF_COEF;
  var totalQty = 0, volSum = 0, realSum = 0, cbm = 0;
  for(var i=0;i<items.length;i++){
    var it = items[i], q = it.qty > 0 ? it.qty : 1;
    totalQty += q;
    volSum  += it.L * it.W * it.H / coef * q;      // 材积重（按所选抛比系数）
    realSum += it.gw * q;                          // 实重合计
    cbm     += it.L * it.W * it.H / 1000000 * q;   // 总体积（CBM）
  }
  var charge = Math.floor(Math.max(volSum, realSum));
  var margin = charge < 300 ? 2 : 1;
  var zones = data.jl[opt.country] || {};
  var z = matchZone(zones, opt.zip);
  var zc = z ? zones[z] : null;
  var billJ = Math.max(charge, 25), billO = Math.max(charge, 100);

  function trTxt(kind){
    var d = dlv[opt.country] || [4,8];
    if(kind === 'trk'){return '装车后18-22天提取，派送'+d[0]+'-'+d[1]+'天，全程约22-30天';}
    return '开船后35-43天提取，派送'+d[0]+'-'+d[1]+'天，全程约'+(35+d[0])+'-'+(43+d[1])+'天';
  }
  var rows = [];
  function pushRow(sup, ch, base, bill, kind){
    if(!base){return;}
    var pri = base + margin, total = bill * pri + 850;
    rows.push({sup:sup, ch:ch, pri:pri, total:total, totalText:fmt(total), tr:trTxt(kind)});
  }
  if(zc && zc.sea){pushRow('锦联 海运','DHL卡派 双清包税', band(zc.sea, billJ), billJ, 'sea');}
  if(zc && zc.trk){pushRow('锦联 卡航','DHL派送 双清包税', band(zc.trk, billJ), billJ, 'trk');}
  var okp = data.ok[opt.country];
  if(okp){pushRow('欧氪 海运','卡派包税 华南仓', okBand(okp, billO), billO, 'sea');}

  var val = opt.value || 0;
  var prem = val ? Math.max(val * 0.003, 100) : 0;
  var insTxt = val ? ('保险：货值×0.3%（最低100/票）→ 保费 ¥'+fmt(prem))
                   : '保险：货值×0.3%（最低100/票），需客户确认货值';
  var pm = charge < 300 ? '（<300kg +2/kg）' : '（≥300kg +1/kg）';
  var minTxt = ((billJ > charge) || (billO > charge)) ? ' · <span class="note">低于起计量，锦联按25kg/欧氪按100kg计</span>' : '';

  /* —— 新增：密度分析（重货/抛货）—— */
  var basis = 1000000 / coef;                 // 渠道基准 kg/CBM（1:6000 → 166.7 ≈167）
  var density = cbm > 0 ? realSum / cbm : 0;  // 实际货重比 kg/CBM
  var isHeavy = realSum >= volSum;            // 按实重计费即重货

  /* —— 简版报价（沿用原格式，不增删行）—— */
  var lines = [opt.country+'DDP  计费重'+charge+'kg  邮编'+(opt.zip.replace(/\D/g,'').slice(0,2)||'')];
  function ln(p, ch, bill){if(p == null){return;} lines.push(ch+'：'+p.toFixed(1)+'/kg+派送费 500/票+报关费 350/票='+fmt(bill*p+850)+'/票');}
  if(zc && zc.sea){var a = band(zc.sea, billJ); ln(a == null ? null : a + margin, '海运+卡派', billJ);}
  if(okp){var b = okBand(okp, billO); ln(b == null ? null : b + margin, '海运+卡派', billO);}
  if(zc && zc.trk){var d2 = band(zc.trk, billJ); ln(d2 == null ? null : d2 + margin, '卡航', billJ);}
  lines.push('时效：开船后35-43天左右提取（盐田-鹿特丹32-38天到港+清关提柜3-5天），派送'+(dlv[opt.country]||[4,8])[0]+'-'+(dlv[opt.country]||[4,8])[1]+'天');
  lines.push(insTxt);

  return {
    country: opt.country, zip: opt.zip, coef: coef, itemCount: items.length, totalQty: totalQty,
    realWeight: realSum, volWeight: volSum, cbm: cbm, charge: charge, margin: margin,
    billJ: billJ, billO: billO, basis: basis, density: density, isHeavy: isHeavy,
    zone: z, zoneName: z ? ('分区'+z) : '—', rows: rows, prem: prem, insTxt: insTxt,
    pmText: pm, minTxt: minTxt, simpleText: lines.join('\n')
  };
}

/* ====================== 页面交互 ====================== */
function curCoef(){
  var v = document.getElementById('coef').value;
  if(v === 'custom'){
    var n = parseFloat(document.getElementById('coefCustom').value);
    return n > 0 ? n : null;
  }
  return parseFloat(v) || DEF_COEF;
}
function addItem(def){
  def = def || {};
  var box = document.createElement('div');
  box.className = 'item';
  box.innerHTML =
    '<div class="item-head"><span class="idx">货物</span><button class="del" type="button" onclick="delItem(this)">删除</button></div>'+
    '<div class="row">'+
      '<div><label>长 cm</label><input class="i-l" type="number" inputmode="decimal" value="'+(def.L||'')+'"></div>'+
      '<div><label>宽 cm</label><input class="i-w" type="number" inputmode="decimal" value="'+(def.W||'')+'"></div>'+
      '<div><label>高 cm</label><input class="i-h" type="number" inputmode="decimal" value="'+(def.H||'')+'"></div>'+
    '</div>'+
    '<div class="row">'+
      '<div><label>件数</label><input class="i-q" type="number" min="1" value="'+(def.qty||1)+'"></div>'+
      '<div><label>单件实重 kg</label><input class="i-g" type="number" inputmode="decimal" value="'+(def.gw||'')+'"></div>'+
    '</div>';
  document.getElementById('items').appendChild(box);
  renumber();
}
function delItem(btn){
  var box = btn.parentNode.parentNode;
  var wrap = document.getElementById('items');
  wrap.removeChild(box);
  if(!wrap.children.length){addItem();}
  renumber();
}
function renumber(){
  var boxes = document.getElementById('items').children;
  for(var i=0;i<boxes.length;i++){
    var t = boxes[i].querySelector('.idx');
    if(t){t.textContent = '第 '+(i+1)+' 项';}
  }
}
function clearItems(){
  var wrap = document.getElementById('items');
  while(wrap.firstChild){wrap.removeChild(wrap.firstChild);}
}
function collectItems(){
  var boxes = document.getElementById('items').children, out = [], bad = false;
  for(var i=0;i<boxes.length;i++){
    var b = boxes[i];
    var L = parseFloat(b.querySelector('.i-l').value), W = parseFloat(b.querySelector('.i-w').value),
        H = parseFloat(b.querySelector('.i-h').value), gw = parseFloat(b.querySelector('.i-g').value),
        q = parseFloat(b.querySelector('.i-q').value) || 1;
    var empty = !L && !W && !H && !gw;                  // 整行留空则忽略
    if(empty){b.className = 'item'; continue;}
    if(!L || !W || !H || !gw){b.className = 'item err'; bad = true; continue;}
    b.className = 'item';
    out.push({L:L, W:W, H:H, qty:q, gw:gw});
  }
  return {items:out, bad:bad};
}
function parsePaste(){
  var raw = document.getElementById('paste').value || '';
  var segs = raw.split(/[\n;；]+/).map(function(s){return s.trim();}).filter(function(s){return s;});
  var found = [];
  for(var i=0;i<segs.length;i++){
    var s = segs[i];
    var m = s.match(/(\d+(?:\.\d+)?)\s*[*xX×✕]\s*(\d+(?:\.\d+)?)\s*[*xX×✕]\s*(\d+(?:\.\d+)?)/);
    if(!m){continue;}
    var L = parseFloat(m[1]), W = parseFloat(m[2]), H = parseFloat(m[3]);
    var rest = s.replace(m[0], ' ');
    var qm = rest.match(/(\d+(?:\.\d+)?)\s*(件|箱|个|pcs\.?|ctns?|cartons?)/i);
    var qty = qm ? parseFloat(qm[1]) : 1;
    if(qm){rest = rest.replace(qm[0], ' ');}
    var wm = rest.match(/(\d+(?:\.\d+)?)\s*(kg|kgs|公斤|千克)/i);
    var gw = wm ? parseFloat(wm[1]) : null;
    if(gw === null){var nm = rest.match(/(\d+(?:\.\d+)?)/); if(nm){gw = parseFloat(nm[1]);}}
    if(gw === null){continue;}
    found.push({L:L, W:W, H:H, qty:qty, gw:gw});
  }
  if(!found.length){
    alert('没识别到「长*宽*高 … 重量」格式\n请按示例填写，例如：\n211*32*115cm 1件 114kg\n（多行可一次粘贴）');
    return;
  }
  clearItems();
  for(var k=0;k<found.length;k++){addItem(found[k]);}
  document.getElementById('paste').value = '';
  alert('已识别 '+found.length+' 项，请核对尺寸与重量');
}
function calc(){
  try{
  var c = document.getElementById('country').value;
  var zip = document.getElementById('zip').value.trim();
  var val = parseFloat(document.getElementById('val').value) || 0;
  var coef = curCoef();
  var out = document.getElementById('out');
  if(!zip){out.innerHTML = '<div class="zh">请填齐 尺寸/实重/邮编 三项</div>'; return;}
  if(coef === null){out.innerHTML = '<div class="zh">请填写有效的抛比系数</div>'; return;}
  var got = collectItems();
  if(got.bad || !got.items.length){
    out.innerHTML = got.bad
      ? '<div class="zh">请填齐 尺寸/实重/邮编 三项（标橙色行缺尺寸或实重）</div>'
      : '<div class="zh">请填齐 尺寸/实重/邮编 三项</div>';
    return;
  }
  lsSet('q_last_zip', zip);

  var r = computeQuote(DATA, DLV, {country:c, zip:zip, value:val, coef:coef, items:got.items});
  var rows = '';
  for(var i=0;i<r.rows.length;i++){
    var w = r.rows[i];
    rows += '<tr><td>'+w.sup+'<br><span class="note">'+w.ch+'</span></td>'+
            '<td class="pri">¥'+w.totalText+'<br><span class="note">'+'单价'+w.pri.toFixed(1)+'/kg · 时效'+w.tr+'</span></td></tr>';
  }

  /* 汇总行（v2 新增，展示多行合并结果与重货/抛货判断） */
  var sum1 = r.itemCount+' 项 · 共 '+r.totalQty+' 件 · 实重 '+fmt(r.realWeight)+'kg · 材积重 '+r.volWeight.toFixed(1)+'kg（÷'+(r.coef%1===0?r.coef:r.coef)+'）· 体积 '+r.cbm.toFixed(3)+'CBM';
  var sum2 = '货重比 '+r.density.toFixed(1)+'kg/CBM vs 渠道基准 '+r.basis.toFixed(0)+'kg/CBM → '+
             (r.isHeavy ? '<span class="tag tag-heavy">重货</span> 按实重计费'
                        : '<span class="tag tag-light">抛货</span> 按材积重计费');
  var warn = '';
  if(r.coef !== DEF_COEF){
    warn = '<div class="zh">⚠️ 当前按 1:'+r.coef+' 核算材积重，但锦联/欧氪海运卡派实际按 1:'+DEF_COEF+' 计费，'+
           '本页报价仅供参考，请切回 1:'+DEF_COEF+' 或与货代确认</div>';
  }

  out.innerHTML =
   '<div class="card"><div class="out-title">计费重 '+r.charge+'kg'+r.pmText+r.minTxt+'</div>'+
   '<div class="note">'+sum1+'</div>'+
   '<div class="note">'+sum2+'</div>'+
   '<div class="note">'+(r.zoneName === '—' ? '⚠️ 邮编未匹配到分区（仅报欧氪或核对邮编）' : '邮编 '+zip+' → '+r.zoneName)+'</div>'+
   warn+
   '<table><tr><th>渠道</th><th>总价/票（DDP到门）</th></tr>'+rows+'</table>'+
   '<button class="btn-sm" onclick="copyTxt()">复制简版报价</button>'+
   '<textarea id="ct" class="copybox" readonly></textarea>'+
   '<div class="note">'+r.insTxt+'</div></div>';
  document.getElementById('ct').value = r.simpleText;
  }catch(err){
    out.innerHTML='<div class="zh">出错了：'+(err&&err.message?err.message:err)+'（请确认用的是最新版报价查询器）</div>';
  }
}
function copyTxt(){
  var t=document.getElementById('ct');
  t.select();t.setSelectionRange(0,99999);
  var ok=false;
  try{ok=document.execCommand('copy');}catch(e){}
  alert(ok?'已复制，可直接粘贴发送':'请长按文本框手动复制');
}

/* 初始化：无 DOM 环境（如自动化测试）直接跳过，保证 computeQuote 可被独立调用 */
function initPage(){
  var sel = document.getElementById('country');
  if(!sel){return;}
  Object.keys(DATA.jl).forEach(function(c){var o=document.createElement('option');o.textContent=c;sel.appendChild(o);});
  sel.value = lsGet('q_last_country') || sel.options[0].value;
  document.getElementById('zip').value = lsGet('q_last_zip') || '';
  sel.onchange = function(){lsSet('q_last_country', sel.value);};
  document.getElementById('coef').onchange = function(){
    var cu = document.getElementById('coefCustom');
    cu.style.display = (this.value === 'custom') ? 'block' : 'none';
  };
  document.getElementById('ver').textContent = DATA.ver;
  addItem();
}
initPage();
</script>
